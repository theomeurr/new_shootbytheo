# Administration du site (Sveltia CMS), à l'adresse /admin/.
# En local (npm run dev) : bouton « Work with Local Repository ».
# En ligne : connexion GitHub via le relais Cloudflare (sbt-cms-admin).

backend:
  name: github
  repo: theomeurr/new_shootbytheo
  branch: main
  base_url: https://sbt-cms-admin.t-meurier13.workers.dev

app_title: Shoot by Théo — administration

# Images hors reportages (prestations, bandeau) : content/images/
media_folder: content/images
public_folder: /images

# Chaque photo déposée est réduite à 2560 px et convertie en WebP avant d'être enregistrée.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 88
          width: 2560
          height: 2560

slug:
  encoding: ascii
  clean_accents: true

collections:
  # -------------------------------------------------------------------------
  # Reportages : un dossier par reportage (event.json + les photos à côté).
  # -------------------------------------------------------------------------
  - name: evenements
    label: Reportages
    label_singular: Reportage
    icon: photo_library
    folder: content/evenements
    create: true
    delete: true
    slug: "{{fields.title}}-{{fields.location}}-{{date | date('YYYY')}}"
    path: '{{slug}}/event'
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}} · {{date | date('DD/MM/YYYY')}}"
    thumbnail: [cover, 'gallery.*']
    sortable_fields:
      fields: [date, title, competition]
      default:
        field: date
        direction: descending
    view_groups:
      groups:
        - name: categorie
          label: Catégorie
          field: competition
    view_filters:
      filters:
        - name: brouillons
          label: Brouillons
          field: draft
          pattern: true
        - name: telechargement
          label: Téléchargement autorisé
          field: download
          pattern: true
    bulk_edit:
      fields: [title, date, competition, location, download, draft]
    media_folder: ''
    public_folder: ''
    fields:
      # --- Ce qu'on remplit à chaque reportage, dans l'ordre ---
      - name: title
        label: Titre
        widget: string
        hint: 'Ex. Top 12 • Journée 2'

      - name: date
        label: Date
        widget: datetime
        type: date
        required: true

      - name: competition
        label: Catégorie
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        display_fields: [name]
        search_fields: [name]
        sort_by:
          field: _manual
        required: false
        hint: 'Catégorie absente ? Bouton « Ajouter Catégorie » ci-dessus.'

      - name: matches
        label: Rencontres
        label_singular: une rencontre
        widget: list
        required: false
        hint: 'Ex. BC Chambly — Béthune'

      - name: gallery
        label: Photos
        widget: image
        multiple: true
        required: false
        hint: 'Glissez toutes les photos d’un coup. La première est la couverture : faites glisser une vignette pour changer l’ordre.'

      - name: cover
        label: Autre couverture
        widget: image
        required: false
        hint: 'Facultatif. Sinon, la première photo.'

      - name: description
        label: Description
        widget: text
        required: false

      - name: location
        label: Lieu (ville)
        widget: string
        required: false
        default: Chambly

      - name: download
        label: Autoriser le téléchargement
        widget: boolean
        default: false

      - name: downloadUrl
        label: Lien de l’album complet
        widget: string
        required: false
        hint: 'Google Drive, WeTransfer… (facultatif)'

      - name: draft
        label: Brouillon (non publié)
        widget: boolean
        default: false
        required: false

      # --- Plus rare ---
      - name: venue
        label: Salle / gymnase
        widget: string
        required: false

      - name: sport
        label: Sport
        widget: string
        required: false
        default: Badminton

      # --- Champs avancés, cachés : les valeurs existantes sont conservées. ---
      - { name: teams, widget: hidden }
      - { name: type, widget: hidden }
      - { name: category, widget: hidden }
      - { name: dateEnd, widget: hidden }
      - { name: coverPosition, widget: hidden, default: '50% 40%' }
      - { name: seoTitle, widget: hidden }
      - { name: seoDescription, widget: hidden }

  # -------------------------------------------------------------------------
  # Catégories : les filtres de la page Galeries (Top 12, Pré-Nationale…).
  # -------------------------------------------------------------------------
  - name: categories
    label: Catégories
    label_singular: Catégorie
    icon: label
    folder: content/categories
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: name
    slug: '{{fields.name}}'
    reorder: true
    fields:
      - { name: name, label: Nom, widget: string }

# ---------------------------------------------------------------------------
# Pages et réglages : un formulaire par fichier.
# ---------------------------------------------------------------------------
singletons:
  - name: prestations
    label: Page Prestations
    icon: work
    file: content/prestations.json
    format: json
    fields:
      - { name: title, label: Titre de la page, widget: string }
      - { name: intro, label: Introduction, widget: text }
      - name: services
        label: Prestations
        label_singular: prestation
        widget: list
        summary: '{{fields.title}}'
        thumbnail: image
        fields:
          - { name: title, label: Titre, widget: string }
          - { name: text, label: Texte, widget: text }
          - name: points
            label: Points forts (facultatif)
            widget: list
            required: false
            field: { name: point, label: Point fort, widget: string }
          - { name: image, label: Photo, widget: image }
          - name: contactType
            label: Type choisi dans le formulaire de contact
            widget: select
            options: [Photographie, Vidéo, Photo + Vidéo, Réseaux sociaux, Autre]
            default: Photographie

  - name: site
    label: Réglages du site
    icon: settings
    file: content/site.json
    format: json
    fields:
      - { name: name, label: Nom du site, widget: string }
      - { name: tagline, label: Sous-titre de l’accueil, widget: string, hint: 'Ex. Photographe sportif' }
      - name: hero
        label: Grande photo de l’accueil
        widget: object
        fields:
          - { name: autoplaySeconds, widget: hidden, default: 7 }
          - name: slides
            label: Reportages à la une
            widget: list
            summary: '{{fields.event}}'
            hint: 'Vide : le dernier reportage.'
            fields:
              - name: event
                label: Reportage
                widget: relation
                collection: evenements
                value_field: '{{slug}}'
                search_fields: [title, location]
                display_fields: [title]
              - { name: photo, widget: hidden, default: cover }
              - { name: position, widget: hidden, default: '50% 40%' }
      - { name: galleryBanner, label: Photo du bandeau de la page Galeries, widget: image, required: false }
      - { name: description, label: Description pour Google, widget: text }
      - { name: email, label: E-mail de contact, widget: string }
      - name: socials
        label: Réseaux sociaux
        widget: list
        summary: '{{fields.label}} — {{fields.handle}}'
        fields:
          - { name: label, label: Nom, widget: string, hint: 'Ex. Instagram' }
          - { name: handle, label: Identifiant affiché, widget: string, hint: 'Ex. @shootby.theo' }
          - { name: url, label: Adresse, widget: string }
      - name: contact
        label: Formulaire de contact
        widget: object
        required: false
        fields:
          - { name: formEndpoint, label: Adresse du service de formulaire, widget: string, required: false, hint: 'Ex. https://formspree.io/f/xxxxxxxx. Vide : le bouton ouvre la messagerie du visiteur.' }
      - name: legal
        label: Mentions légales
        widget: object
        required: false
        fields:
          - { name: publisher, label: Éditeur du site, widget: string, required: false, hint: 'Nom et prénom, ou raison sociale' }
          - { name: status, label: Statut, widget: string, required: false, hint: 'Ex. micro-entrepreneur' }
          - { name: siret, label: SIRET, widget: string, required: false }
          - { name: address, label: Adresse postale, widget: string, required: false }
          - { name: publicationDirector, label: Directeur de la publication, widget: string, required: false }
          - name: host
            label: Hébergeur
            widget: object
            required: false
            fields:
              - { name: name, label: Nom de l’hébergeur, widget: string, required: false }
              - { name: address, label: Adresse de l’hébergeur, widget: string, required: false }
              - { name: contact, label: Téléphone ou site de l’hébergeur, widget: string, required: false }
      # Réglages techniques : cachés (les valeurs existantes sont conservées).
      - { name: url, widget: hidden }
      - { name: logo, widget: hidden }
      - { name: headerTagline, widget: hidden }
      - { name: slogan, widget: hidden }
      - { name: mediaBaseUrl, widget: hidden }
