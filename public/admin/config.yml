# Configuration de l'interface d'administration (Sveltia CMS).
# Voir le README, section « Interface d'administration », pour le mode d'emploi.
#
# - En local (npm run dev) : fonctionne tout de suite, sans rien configurer ci-dessous
#   (bouton « Work with Local Repository », voir README).
# - À distance, depuis n'importe quel navigateur (Mac, téléphone…) : connexion GitHub via
#   le petit relais déployé sur Cloudflare Workers (sbt-cms-admin) — voir README.

backend:
  name: github
  repo: theomeurr/new_shootbytheo
  branch: main
  base_url: https://sbt-cms-admin.t-meurier13.workers.dev

app_title: Shoot by Théo — administration

# Images hors reportages (prestations, portrait, bandeau) : content/images/
media_folder: content/images
public_folder: /images

# Optimisation à l'envoi, directement dans le navigateur : chaque photo glissée dans
# l'administration est réduite à 2560 px maximum et convertie en WebP (qualité 88)
# avant d'être enregistrée. Les fichiers de 10-20 Mo de l'appareil deviennent ~300-600 Ko,
# sans perte visible ; le site génère ensuite ses propres tailles (AVIF/WebP) au build.
# Les photos HEIC de l'iPhone sont converties aussi.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 88
          width: 2560
          height: 2560

# Adresses sans accents ni espaces : « Pré-Nationale • Journée 2 » → pre-nationale-journee-2
slug:
  encoding: ascii
  clean_accents: true

collections:
  # -------------------------------------------------------------------------
  # Reportages : un dossier par reportage (event.json + les photos à côté).
  # -------------------------------------------------------------------------
  - name: evenements
    label: Reportages
    label_singular: Reportage
    icon: photo_library
    description: 'Chaque reportage a sa carte dans Galeries et sa propre page. Glissez les photos d’un coup : la première devient la couverture.'
    folder: content/evenements
    create: true
    delete: true
    # Adresse de la page calculée à partir du titre, du lieu et de l'année : rien à taper.
    slug: "{{fields.title}}-{{fields.location}}-{{date | date('YYYY')}}"
    path: '{{slug}}/event'
    extension: json
    format: json
    identifier_field: title
    summary: "{{title}} · {{date | date('DD/MM/YYYY')}}"
    thumbnail: [cover, 'gallery.*']
    sortable_fields:
      fields: [date, title, competition]
      default:
        field: date
        direction: descending
    view_groups:
      groups:
        - name: categorie
          label: Catégorie
          field: competition
    view_filters:
      filters:
        - name: brouillons
          label: Brouillons
          field: draft
          pattern: true
        - name: telechargement
          label: Téléchargement autorisé
          field: download
          pattern: true
    # Bouton « Modifier en masse » : un tableau pour corriger titres, dates, catégories,
    # lieux et téléchargement de plusieurs reportages d'un coup (un seul enregistrement).
    bulk_edit:
      fields: [title, date, competition, location, download, draft]
    # Les photos sont enregistrées dans le dossier du reportage, à côté de event.json.
    media_folder: ''
    public_folder: ''
    fields:
      # --- Ce qu'on remplit à chaque reportage, dans l'ordre ---
      - name: title
        label: Titre
        widget: string
        hint: 'Ex. « Top 12 • Journée 2 ». Le « • » ne passe jamais seul en début de ligne.'

      - name: date
        label: Date
        widget: datetime
        type: date
        required: true

      - name: competition
        label: Catégorie
        widget: relation
        collection: categories
        value_field: '{{slug}}'
        display_fields: [name]
        search_fields: [name]
        sort_by:
          field: _manual
        required: false
        hint: 'Sert de filtre dans Galeries. Catégorie absente de la liste ? Ajoutez-la ici sans quitter la fiche.'

      - name: matches
        label: Rencontres
        label_singular: une rencontre
        widget: list
        required: false
        hint: 'Une ligne par rencontre, ex. « BC Chambly — Béthune ».'

      - name: gallery
        label: Photos
        widget: image
        multiple: true
        required: false
        hint: 'Glissez toutes les photos d’un coup (ou sélection multiple). Elles sont réduites et converties automatiquement. Faites glisser une vignette pour changer l’ordre : la première est la couverture.'

      - name: cover
        label: Couverture (facultatif)
        widget: image
        required: false
        hint: 'Laisser vide : la première photo ci-dessus est utilisée. Choisir une photo ici seulement pour imposer une autre couverture.'

      - name: description
        label: Description
        widget: text
        required: false
        hint: 'Une ou deux phrases sur la journée.'

      - name: location
        label: Lieu (ville)
        widget: string
        required: false
        default: Chambly

      - name: download
        label: Autoriser le téléchargement
        widget: boolean
        default: false
        hint: 'Ajoute un bouton « Télécharger » sur chaque photo de la visionneuse.'

      - name: downloadUrl
        label: Lien de l’album complet (facultatif)
        widget: string
        required: false
        hint: 'Lien Google Drive, WeTransfer… vers les photos en pleine définition. Affiche le bouton « Télécharger les photos » si le téléchargement est autorisé.'

      - name: draft
        label: Brouillon (non publié)
        widget: boolean
        default: false
        required: false

      # --- Plus rare ---
      - name: venue
        label: Salle / gymnase
        widget: string
        required: false

      - name: sport
        label: Sport
        widget: string
        required: false
        default: Badminton

      # --- Champs avancés, cachés : les valeurs existantes sont conservées. ---
      - { name: teams, widget: hidden }
      - { name: type, widget: hidden }
      - { name: category, widget: hidden }
      - { name: dateEnd, widget: hidden }
      - { name: coverPosition, widget: hidden, default: '50% 40%' }
      - { name: seoTitle, widget: hidden }
      - { name: seoDescription, widget: hidden }

  # -------------------------------------------------------------------------
  # Catégories : les filtres de la page Galeries (Top 12, Pré-Nationale…).
  # -------------------------------------------------------------------------
  - name: categories
    label: Catégories
    label_singular: Catégorie
    icon: label
    description: 'Les filtres de la page Galeries. Bouton « Réorganiser » pour changer leur ordre. Renommer une catégorie : ses reportages suivent automatiquement.'
    folder: content/categories
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: name
    slug: '{{fields.name}}'
    reorder: true
    fields:
      - { name: name, label: Nom, widget: string, hint: 'Ex. « Nationale 3 », « Tournois », « Événements ».' }

# ---------------------------------------------------------------------------
# Pages et réglages : un formulaire par fichier.
# ---------------------------------------------------------------------------
singletons:
  - name: prestations
    label: Page Prestations
    icon: work
    file: content/prestations.json
    format: json
    fields:
      - { name: title, label: Titre de la page, widget: string }
      - { name: intro, label: Introduction, widget: text }
      - name: services
        label: Prestations
        label_singular: prestation
        widget: list
        summary: '{{fields.title}}'
        thumbnail: image
        fields:
          - { name: label, label: Sur-titre, widget: string, hint: 'Petit mot en couleur au-dessus du titre, ex. « Portraits ».' }
          - { name: title, label: Titre, widget: string }
          - { name: text, label: Texte, widget: text }
          - name: points
            label: Points forts
            widget: list
            required: false
            field: { name: point, label: Point fort, widget: string }
          - { name: image, label: Photo, widget: image }
          - name: contactType
            label: Type présélectionné dans le formulaire de contact
            widget: select
            options: [Photographie, Vidéo, Photo + Vidéo, Réseaux sociaux, Autre]
            default: Photographie

  - name: a-propos
    label: Page À propos
    icon: person
    file: content/a-propos.json
    format: json
    fields:
      - { name: name, label: Nom, widget: string }
      - { name: portrait, label: Portrait, widget: image, hint: 'Une photo verticale de vous, de préférence.' }
      - { name: portraitAlt, label: Description du portrait (accessibilité), widget: string, required: false }
      - name: bio
        label: Présentation
        label_singular: paragraphe
        widget: list
        field: { name: paragraph, label: Paragraphe, widget: text }
      - { name: approachTitle, label: Titre de la partie « approche », widget: string, default: Mon approche }
      - name: approach
        label: Mon approche
        label_singular: paragraphe
        widget: list
        required: false
        field: { name: paragraph, label: Paragraphe, widget: text }

  - name: site
    label: Réglages du site
    icon: settings
    file: content/site.json
    format: json
    fields:
      - { name: name, label: Nom du site, widget: string }
      - { name: tagline, label: Sous-titre de l’accueil, widget: string, hint: 'Affiché au-dessus du grand titre, ex. « Photographe sportif ».' }
      - name: hero
        label: Grande photo de l’accueil
        widget: object
        fields:
          - { name: autoplaySeconds, widget: hidden, default: 7 }
          - name: slides
            label: Reportages à la une
            widget: list
            summary: '{{fields.event}}'
            hint: 'Leur photo de couverture s’affiche en grand sur l’accueil (fondu enchaîné s’il y en a plusieurs). Vide = le dernier reportage.'
            fields:
              - name: event
                label: Reportage
                widget: relation
                collection: evenements
                value_field: '{{slug}}'
                search_fields: [title, location]
                display_fields: [title]
              - { name: photo, widget: hidden, default: cover }
              - { name: position, widget: hidden, default: '50% 40%' }
      - { name: galleryBanner, label: Photo du bandeau de la page Galeries, widget: image, required: false }
      - { name: description, label: Description du site (Google), widget: text, hint: 'Utilisée par Google et les partages quand une page n’a pas sa propre description.' }
      - { name: email, label: E-mail de contact, widget: string }
      - name: socials
        label: Réseaux sociaux
        widget: list
        summary: '{{fields.label}} — {{fields.handle}}'
        fields:
          - { name: label, label: Nom, widget: string, hint: 'Ex. Instagram.' }
          - { name: handle, label: Identifiant affiché, widget: string, hint: 'Ex. @shootby.theo.' }
          - { name: url, label: Adresse, widget: string }
      - name: contact
        label: Formulaire de contact
        widget: object
        required: false
        fields:
          - { name: formEndpoint, label: Adresse du service de formulaire, widget: string, required: false, hint: 'Ex. https://formspree.io/f/xxxxxxxx. Laisser vide : le bouton ouvre un e-mail prérempli dans la messagerie du visiteur.' }
      - name: legal
        label: Mentions légales
        widget: object
        required: false
        fields:
          - { name: publisher, label: Éditeur du site, widget: string, required: false, hint: 'Nom et prénom, ou raison sociale.' }
          - { name: status, label: Statut, widget: string, required: false, hint: 'Ex. micro-entrepreneur.' }
          - { name: siret, label: SIRET, widget: string, required: false }
          - { name: address, label: Adresse postale, widget: string, required: false }
          - { name: publicationDirector, label: Directeur de la publication, widget: string, required: false }
          - name: host
            label: Hébergeur
            widget: object
            required: false
            fields:
              - { name: name, label: Nom de l’hébergeur, widget: string, required: false }
              - { name: address, label: Adresse de l’hébergeur, widget: string, required: false }
              - { name: contact, label: Téléphone ou site de l’hébergeur, widget: string, required: false }
      # Réglages techniques : cachés (les valeurs existantes sont conservées).
      - { name: url, widget: hidden }
      - { name: logo, widget: hidden }
      - { name: headerTagline, widget: hidden }
      - { name: slogan, widget: hidden }
      - { name: mediaBaseUrl, widget: hidden }
